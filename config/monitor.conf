# ==============================================================================
# Linux Server Health Monitor Configuration
# Location: /etc/server-monitor/monitor.conf or ./config/monitor.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Host & Identification
# ------------------------------------------------------------------------------
SERVER_NAME="$(hostname -f 2>/dev/null || hostname 2>/dev/null || echo 'linux-host')"
ENVIRONMENT="production"            # production, staging, development

# ------------------------------------------------------------------------------
# 2. Alert Thresholds (in percent %)
# ------------------------------------------------------------------------------
# CPU Thresholds (% utilization across all cores)
CPU_WARN_THRESHOLD=75
CPU_CRIT_THRESHOLD=90

# Memory Thresholds (% of actual RAM used, buffer/cache aware)
MEM_WARN_THRESHOLD=80
MEM_CRIT_THRESHOLD=92

# Swap Usage Thresholds (%)
SWAP_WARN_THRESHOLD=50
SWAP_CRIT_THRESHOLD=80

# Disk Partition Utilization (%)
DISK_WARN_THRESHOLD=85
DISK_CRIT_THRESHOLD=95

# Disk Inode Saturation (%)
INODE_WARN_THRESHOLD=85
INODE_CRIT_THRESHOLD=95

# System Load Average Threshold (Multiplier relative to available CPU cores)
# e.g., 1.5 means 1.5 * num_cores
LOAD_WARN_MULTIPLIER="1.5"
LOAD_CRIT_MULTIPLIER="2.5"

# Security: Max failed SSH logins in the last hour before alert
FAILED_SSH_THRESHOLD=10

# ------------------------------------------------------------------------------
# 3. Critical Services to Monitor
# List systemd service unit names (without .service) to monitor
# ------------------------------------------------------------------------------
CHECK_SERVICES=(
    "sshd"
    "cron"
    "docker"
    "nginx"
)

# Critical Network Ports to Ensure Listening (TCP)
CHECK_PORTS=(
    22
    80
    443
)

# Disks / Mount points to inspect (leave empty to monitor all physical filesystems)
CHECK_MOUNTS=("/" "/home" "/var")

# ------------------------------------------------------------------------------
# 4. Notification & Alerting Settings
# ------------------------------------------------------------------------------
# Enable or disable alert channels
ENABLE_WEBHOOK=false                # Set to true when WEBHOOK_URL is configured
ENABLE_SYSLOG=true                  # Logs alerts to syslog / journald
ENABLE_EMAIL=false

# Webhook Destination (Supports Slack, Discord, Teams, or generic webhook)
# Slack example: https://hooks.slack.com/services/T000/B000/XXXXX
# Discord example: https://discord.com/api/webhooks/XXX/YYY
WEBHOOK_URL=""
WEBHOOK_TYPE="slack"               # slack, discord, generic

# Email Alert Configuration (requires mailutils or sendmail)
ALERT_EMAIL_RECIPIENT="admin@example.com"
ALERT_EMAIL_SENDER="monitor@$(hostname -d 2>/dev/null || echo 'localhost')"

# Alert Cooldown in minutes: Avoid spamming notifications for persistent issues
# A repeat alert for the same active warning/critical state is silenced during this window
ALERT_COOLDOWN_MINUTES=30

# ------------------------------------------------------------------------------
# 5. Paths & Logging
# ------------------------------------------------------------------------------
LOG_LEVEL="INFO"                    # DEBUG, INFO, WARN, ERROR
LOG_FILE="/var/log/server-monitor/monitor.log"
LOCK_FILE="/var/run/server-monitor.lock"
STATE_FILE="/var/run/server-monitor.state"
HTML_REPORT_PATH="/var/www/html/server-health.html"
